name: Source and workflow checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.1'
          use-public-rspm: true
      - uses: r-lib/actions/setup-renv@v2
      - name: Check publication policy and scientific invariants
        run: make check
      - name: Render the synthetic demonstration
        run: make demo
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true
      - name: Compile manuscript source
        run: make manuscript
