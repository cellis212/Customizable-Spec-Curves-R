name: Source and workflow checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.1'
          use-public-rspm: true
      - uses: r-lib/actions/setup-renv@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install the Python port
        run: python -m pip install -e python
      - name: Check publication policy, R and Python workflow invariants
        run: make check PYTHON=python
      - name: Run the synthetic demonstration in R and Python and compare
        run: |
          make demo
          run=$(ls -d local/output/synthetic-demo/*/ | tail -1)
          python -m speccurve run paper/config/demo.json "$run/generated_input.csv" "$run/python" --no-plot
          python tools/compare_implementations.py "$run/results.csv" "$run/python/results.csv"
