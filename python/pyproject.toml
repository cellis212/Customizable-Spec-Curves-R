[project]
name = "speccurve"
version = "0.1.0"
description = "Python port of the reference specification-curve workflow for empirical finance"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "pandas>=2.1", "scipy>=1.11", "pyfixest>=0.60", "matplotlib>=3.8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["speccurve"]
