project:
  type: default
  output-dir: output
  render:
    - paper.qmd

format:
  pdf:
    documentclass: article
    papersize: letter
    geometry: margin=1in
    fontsize: 11pt
    linestretch: 1.5
    number-sections: true
    colorlinks: true
    keep-tex: true
    fig-dpi: 300
    include-in-header:
      - text: |
          \usepackage{placeins}

execute:
  enabled: false
  echo: false

bibliography: references.bib
cite-method: citeproc
